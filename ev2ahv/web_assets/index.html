<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ev2ahv Migration Console</title>
<style>
:root{--nav:#22272e;--nav2:#2f363f;--line:#dfe3e8;--bg:#f3f5f7;--text:#22272e;--muted:#6b7682;--blue:#1b6fd8;--blue2:#155cb4;--green:#2c9c5a;--amber:#d98a00;--red:#d23f3f;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{height:50px;background:var(--nav);color:#fff;display:flex;align-items:center;padding:0 18px;gap:26px}
.brand{font-weight:600;font-size:16px;display:flex;gap:9px;align-items:center}.mark{width:20px;height:20px;border-radius:4px;background:linear-gradient(135deg,#4aa3ff,#2c9c5a)}
nav{display:flex;height:100%}nav button{background:none;border:0;border-bottom:3px solid transparent;color:#c6ccd3;padding:0 15px;font:inherit;cursor:pointer}nav button:hover{color:#fff}nav button.on{color:#fff;border-color:#4aa3ff}
.right{margin-left:auto;display:flex;gap:12px;align-items:center;color:#c6ccd3;font-size:13px}.link{background:none;border:0;color:inherit;cursor:pointer;font:inherit}
main{padding:22px 26px;max-width:1440px;margin:auto}.bar{display:flex;align-items:center;gap:12px;margin-bottom:16px}h1{font-size:21px;font-weight:500;margin:0}h2{font-size:15px;font-weight:600;margin:0 0 12px}.grow{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:16px}.table{padding:0;overflow:auto}table{border-collapse:collapse;width:100%}th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;background:#fafbfc}th,td{padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}tr:last-child td{border-bottom:0}tbody tr.click{cursor:pointer}tbody tr.click:hover{background:#f2f7fd}
.btn{background:#fff;border:1px solid #c5ccd4;border-radius:3px;padding:7px 14px;font:inherit;cursor:pointer;color:var(--text)}.btn:hover{background:#f4f6f8}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue2)}.btn.danger{color:var(--red);border-color:#e4b4b4}.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:600;background:#e7ebef;color:#46515c}.pill.good{background:#dff3e7;color:#1e7a44}.pill.run{background:#dcebfb;color:#155cb4}.pill.warn{background:#fcefd6;color:#8f5b00}.pill.bad{background:#fbe2e2;color:#a92e2e}
.steps{display:flex;margin:6px 0 4px}.step{flex:1;text-align:center;position:relative;font-size:12px;color:var(--muted)}.step i{display:flex;width:26px;height:26px;margin:0 auto 6px;border-radius:50%;background:#dfe3e8;color:#fff;align-items:center;justify-content:center;font-style:normal;font-weight:600;position:relative;z-index:1}.step:not(:last-child):after{content:"";position:absolute;top:13px;left:50%;width:100%;height:2px;background:#dfe3e8}.step.done i{background:var(--green)}.step.done:after{background:var(--green)}.step.now i{background:var(--blue)}.step.done,.step.now{color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px}.kv span:nth-child(odd){color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:8px}
.meter{height:7px;background:#e7ebef;border-radius:4px;overflow:hidden;margin:4px 0 10px}.meter b{display:block;height:100%;background:var(--blue)}pre{background:#1f242b;color:#d7dde4;padding:12px;border-radius:3px;max-height:330px;overflow:auto;font:12px/1.45 Consolas,Menlo,monospace;margin:0;white-space:pre-wrap;word-break:break-all}
label{display:block;font-size:12px;font-weight:600;color:#46515c;margin-bottom:12px}input,select,textarea{display:block;width:100%;margin-top:4px;padding:7px 9px;border:1px solid #c5ccd4;border-radius:3px;font:13px "Segoe UI",Roboto,sans-serif;background:#fff;color:var(--text)}textarea{font-family:Consolas,Menlo,monospace;min-height:330px}input:focus,select:focus,textarea:focus{outline:2px solid #b8d6f7;border-color:var(--blue)}.check{display:flex;gap:7px;align-items:center;font-weight:400}.check input{width:auto;margin:0}.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.login{width:360px;margin:12vh auto}.login h1{margin-bottom:4px}.muted{color:var(--muted)}.err{color:var(--red);min-height:20px;font-size:13px}.ok{color:var(--green);min-height:20px;font-size:13px}.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs .btn.on{background:#e6f0fb;border-color:var(--blue);color:var(--blue2)}
.wiz{display:flex;gap:4px;margin-bottom:16px}.wiz div{flex:1;padding:8px 10px;background:#e7ebef;color:var(--muted);font-size:12px;font-weight:600}.wiz div.on{background:var(--blue);color:#fff}.wiz div.done{background:#cfe3f8;color:#155cb4}
dialog{border:0;border-radius:5px;padding:20px;width:440px;box-shadow:0 8px 34px #0005}dialog::backdrop{background:#0006}.empty{padding:44px;text-align:center;color:var(--muted)}
@media(max-width:760px){main{padding:14px}header{gap:8px;padding:0 10px}nav{flex:1;min-width:0;overflow-x:auto}nav button{padding:0 8px;white-space:nowrap}.right{flex:none}.right span{display:none}.steps{overflow-x:auto}.step{min-width:62px}.two{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><dialog id="dlg"></dialog>
<script>
const $=(s,r=document)=>r.querySelector(s),app=$('#app');let view='plans',current=null,timer=null,wiz=null,me=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,body){const o=body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'ev2ahv'},body:JSON.stringify(body)};const r=await fetch(path,o);const d=await r.json().catch(()=>({}));if(r.status===401&&path!=='/api/login'){me=false;render();throw new Error('Sign in required')}if(!r.ok)throw new Error(d.error||r.statusText);return d}
const gib=b=>(b/1024**3).toFixed(b<10*1024**3?2:1)+' GiB',secs=s=>s==null?'–':s<90?Math.round(s)+' s':(s/60).toFixed(1)+' min';
const when=t=>t?new Date(t*1000).toISOString().replace('T',' ').slice(0,19)+' UTC':'–';
function phase(p){const j=p.job&&p.job.status==='running';if(j)return['run',p.job.action+' running'];if(p.job&&p.job.status==='failed')return['bad',p.job.action+' failed'];const m={new:['','Not started'],seeded:['run','Seeded'],'cutover-complete':['good','Cutover complete'],'rolled-back':['warn','Rolled back'],cleaned:['','Cleaned up'],invalid:['bad','Invalid plan']};return m[p.phase]||['',p.phase]}
const pill=p=>{const[c,t]=phase(p);return`<span class="pill ${c}">${esc(t)}</span>`};
function shell(inner){app.innerHTML=`<header><div class="brand"><span class="mark"></span>ev2ahv</div><nav>${[['plans','Migration Plans'],['env','Environments'],['settings','Settings']].map(([k,t])=>`<button class="${view===k?'on':''}" data-v="${k}">${t}</button>`).join('')}</nav><div class="right"><span>everRun → AHV</span><button class="link" id="out">Sign out</button></div></header><main>${inner}</main>`;app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));$('#out').onclick=async()=>{await api('/api/logout',{});me=false;render()}}
function go(v,c=null){view=v;current=c;wiz=null;render()}
async function render(){clearTimeout(timer);if(!me){const s=await api('/api/session');me=s.authenticated}if(!me)return login();try{await({plans,detail,env,settings,wizard}[view])()}catch(e){if(me)shell(`<div class="card err">${esc(e.message)}</div>`)}}
function login(){app.innerHTML=`<div class="login card"><div class="brand" style="margin-bottom:14px"><span class="mark"></span>ev2ahv</div><h1>Sign in</h1><p class="muted">everRun to Nutanix AHV migration console</p><form id="f"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><div class="err" id="e"></div><button class="btn primary" style="width:100%">Sign in</button></form></div>`;$('#f').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',Object.fromEntries(new FormData(e.target)));me=true;render()}catch(x){$('#e').textContent=x.message}}}
async function plans(){const rows=await api('/api/plans');shell(`<div class="bar"><h1>Migration Plans</h1><span class="grow"></span><button class="btn primary" id="new">Create Plan</button></div><div class="card table">${rows.length?`<table><thead><tr><th>Name</th><th>Status</th><th>Target VM</th><th>Source</th><th>Cluster</th><th>Disks</th><th>vCPU / RAM</th><th>Progress</th><th>Downtime</th></tr></thead><tbody>${rows.map(p=>{const pr=p.progress||[],pct=pr.length?pr.reduce((a,d)=>a+d.pct,0)/pr.length:0;return`<tr class="click" data-p="${esc(p.file)}"><td><b>${esc(p.name||p.file)}</b></td><td>${pill(p)}</td><td>${esc(p.target_vm)}</td><td>${esc(p.source)}</td><td>${esc(p.cluster)}</td><td>${esc(p.disks)}</td><td>${p.cpu?`${esc(p.cpu)} / ${esc(p.memory_mib/1024)} GiB`:''}</td><td style="min-width:120px"><div class="meter" style="margin:0"><b style="width:${pct}%"></b></div></td><td>${secs(p.timings&&p.timings.downtime_seconds)}</td></tr>`}).join('')}</tbody></table>`:`<div class="empty">No migration plans yet. Create one to get started.</div>`}</div>`);$('#new').onclick=()=>{view='wizard';wiz={i:0,d:{}};render()};app.querySelectorAll('[data-p]').forEach(r=>r.onclick=()=>go('detail',r.dataset.p));timer=setTimeout(render,5000)}
function stepIndex(p){if(p.phase==='cutover-complete')return 5;if(p.step)return 3;if(p.phase==='seeded')return 2;return (p.progress||[]).length?1:0}
async function detail(){const p=await api('/api/plans/'+encodeURIComponent(current)),l=await api('/api/plans/'+encodeURIComponent(current)+'/log'),running=p.job&&p.job.status==='running',idx=stepIndex(p),names=['Prep check','Seed','Resync','Cutover','Verify'],tm=p.timings||{},old=$('#log'),stick=!old||old.scrollTop+old.clientHeight>=old.scrollHeight-20;
shell(`<div class="bar"><button class="btn" id="back">‹ Plans</button><h1>${esc(p.name||p.file)}</h1>${pill(p)}<span class="grow"></span></div><div class="card"><div class="steps">${names.map((n,i)=>`<div class="step ${i<idx?'done':i===idx?'now':''}"><i>${i<idx?'✓':i+1}</i>${n}</div>`).join('')}</div></div><div class="card"><h2>Actions</h2><div class="actions">${[['prep-check','Prep Check'],['seed','Start Seed'],['resync','Resync'],['cutover','Cutover','primary'],['rollback','Rollback','danger'],['discard-target','Discard AHV VM','danger'],['cleanup','Clean Up','danger']].map(([a,t,c])=>`<button class="btn ${c||''}" data-a="${a}" ${running?'disabled':''}>${t}</button>`).join('')}<label class="check" style="margin:0 0 0 8px"><input type="checkbox" id="dry">Dry run</label></div></div><div class="grid"><div class="card"><h2>Virtual machine</h2><div class="kv"><span>Target VM</span><span>${esc(p.target_vm)}</span><span>Cluster</span><span>${esc(p.cluster)}</span><span>vCPU / RAM</span><span>${esc(p.cpu)} / ${esc(p.memory_mib/1024)} GiB</span><span>Firmware</span><span>${esc(p.firmware)}</span><span>Disk bus</span><span>${esc(p.bus)}</span><span>Source reader</span><span>${esc(p.source)}</span></div></div><div class="card"><h2>Disks</h2>${(p.progress||[]).map(d=>`<div><b>${esc(d.disk)}</b> <span class="muted">${gib(d.size)}, ${esc(d.passes)} pass(es)${d.active?', syncing':''}</span><div class="meter"><b style="width:${d.pct}%"></b></div></div>`).join('')||'<span class="muted">Not seeded yet.</span>'}</div><div class="card"><h2>Timings</h2><div class="kv"><span>Seed</span><span>${secs(tm.seed_seconds)}</span><span>Last resync</span><span>${secs(tm.last_resync_seconds)}</span><span>Final sync</span><span>${secs(tm.final_sync_seconds)}</span><span>Downtime</span><span>${secs(tm.downtime_seconds)}</span></div></div></div><div class="card"><h2>Activity log${p.job?` <span class="muted" style="font-weight:400">${esc(p.job.action)}, started ${when(p.job.started)}</span>`:''}</h2><pre id="log">${esc(l.log||'No job has run from this console yet.')}</pre></div>`);
const lg=$('#log');if(stick)lg.scrollTop=lg.scrollHeight;$('#back').onclick=()=>go('plans');app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(p,b.dataset.a,$('#dry').checked));timer=setTimeout(render,running?2000:6000)}
function act(p,a,dry){const danger=['cutover','rollback','discard-target','cleanup'].includes(a)&&!dry,txt={cutover:'This stops the source VM, runs the final sync, and starts the VM on AHV.',rollback:'This powers off the AHV VM and powers the source back on.','discard-target':'This deletes the AHV VM. The source and staging disks stay.',cleanup:'This removes the staging disks. The source VM is never deleted.'}[a];if(!danger)return send(p,a,{dry_run:dry});const d=$('#dlg');d.innerHTML=`<h2>Confirm ${esc(a)}</h2><p>${esc(txt)}</p>${a==='cutover'?'<label class="check"><input type="checkbox" id="st">Source is already stopped (no power commands in plan)</label>':''}${a==='cleanup'?'<label class="check"><input type="checkbox" id="dt">Also delete the migrated AHV VM</label>':''}<label>Type <code>${esc(p.name)}</code> to confirm<input id="cf" autocomplete="off"></label><div class="err" id="ce"></div><div class="actions" style="justify-content:flex-end"><button class="btn" id="no">Cancel</button><button class="btn primary" id="yes">Confirm</button></div>`;d.showModal();$('#no').onclick=()=>d.close();$('#yes').onclick=async()=>{try{await send(p,a,{confirm:$('#cf').value,source_already_stopped:$('#st')?.checked,delete_target:$('#dt')?.checked},true);d.close()}catch(e){$('#ce').textContent=e.message}}}
async function send(p,a,b,raise){try{await api(`/api/plans/${encodeURIComponent(p.file)}/action/${a}`,b);render()}catch(e){if(raise)throw e;alert(e.message)}}
async function env(){const c=await api('/api/creds');let rows=await api('/api/plans');const src=[...new Set(rows.map(p=>p.source).filter(Boolean))];shell(`<div class="bar"><h1>Environments</h1></div><div class="grid"><div class="card"><h2>Target: Nutanix AHV</h2><div class="kv"><span>Prism Central</span><span>${esc(c.host||'Not configured')}</span><span>Authentication</span><span>${c.method==='api_key'?'API key':c.method==='basic'?'Username / password':'–'}</span><span>TLS verify</span><span>${c.verify_tls?'On':'Off'}</span></div><br><button class="btn" id="t">Test Connection</button> <button class="btn" id="e">Update Credentials</button><div class="ok" id="m" style="margin-top:8px"></div></div><div class="card"><h2>Source: Stratus everRun</h2><div class="kv"><span>Reader types</span><span>Direct block, export file, local</span><span>In use</span><span>${esc(src.join(', ')||'None')}</span></div><p class="muted">Source access is set per plan. Disks are opened read-only.</p></div></div>`);$('#e').onclick=()=>go('settings');$('#t').onclick=async()=>{const m=$('#m');m.className='ok';m.textContent='Testing…';try{const r=await api('/api/creds/test',{});m.textContent=`Connected to ${r.host}. ${r.vms} VMs visible.`}catch(x){m.className='err';m.textContent=x.message}}}
async function settings(){const c=await api('/api/creds');let method=c.method==='basic'?'basic':'api_key';shell(`<div class="bar"><h1>Settings</h1></div><div class="grid"><div class="card"><h2>Prism Central credentials</h2><div class="tabs"><button class="btn" data-m="api_key">API Key</button><button class="btn" data-m="basic">Username &amp; Password</button></div><form id="pc"><div class="two"><label>Host<input name="host" value="${esc(c.host)}" required></label><label>Port<input name="port" type="number" value="${esc(c.port||9440)}" required></label></div><div id="fields"></div><label class="check"><input type="checkbox" name="verify_tls" ${c.verify_tls?'checked':''}>Verify TLS certificate</label><div class="err" id="pe"></div><div class="ok" id="po"></div><button class="btn primary">Test and Save</button></form><p class="muted">Credentials are tested first, then stored in a private file on this server. Saved secrets are never shown again.</p></div><div class="card"><h2>Console password</h2><form id="pw"><label>Current password<input name="current" type="password" autocomplete="current-password" required></label><label>New password<input name="new" type="password" autocomplete="new-password" minlength="8" required></label><div class="err" id="we"></div><div class="ok" id="wo"></div><button class="btn">Change Password</button></form></div></div>`);
const draw=()=>{app.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===method));$('#fields').innerHTML=method==='api_key'?'<label>API key<input name="api_key" type="password" autocomplete="off" required></label>':`<label>Username<input name="username" value="${esc(c.username||'')}" autocomplete="off" required></label><label>Password<input name="password" type="password" autocomplete="off" required></label>`};draw();app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{method=b.dataset.m;draw()});
$('#pc').onsubmit=async e=>{e.preventDefault();$('#pe').textContent='';$('#po').textContent='Testing…';const f=Object.fromEntries(new FormData(e.target));try{const r=await api('/api/creds',{...f,method,verify_tls:!!f.verify_tls});$('#po').textContent=`Saved. ${r.vms} VMs visible.`;e.target.querySelectorAll('[type=password]').forEach(x=>x.value='')}catch(x){$('#po').textContent='';$('#pe').textContent=x.message}};
$('#pw').onsubmit=async e=>{e.preventDefault();$('#we').textContent='';$('#wo').textContent='';try{await api('/api/ui-password',Object.fromEntries(new FormData(e.target)));$('#wo').textContent='Password changed.';e.target.reset()}catch(x){$('#we').textContent=x.message}}}
const WZ=['Source','Target','VM Settings','Disks & Network','Review'];
function field(k,t,v,attrs=''){return`<label>${t}<input name="${k}" value="${esc(wiz.d[k]??v??'')}" ${attrs}></label>`}
function sel(k,t,o,v){const c=wiz.d[k]??v;return`<label>${t}<select name="${k}">${o.map(x=>`<option ${x===c?'selected':''}>${x}</option>`).join('')}</select></label>`}
function planDoc(){const d=wiz.d,disks=(d.disks||'').split('\n').map(x=>x.trim()).filter(Boolean).map((l,i)=>{const[a,b]=l.split(/\s+/);return b?{name:a,path:b}:{name:'disk'+i,path:a}}),nics=(d.nics||'').split('\n').map(x=>x.trim()).filter(Boolean).map(l=>{const[subnet,mac]=l.split(/\s+/);return mac?{subnet,mac,keep_mac:true}:{subnet,keep_mac:false}}),source={type:d.stype||'direct',max_mbps:+d.mbps||0};if(d.shost)source.host=d.shost;if(d.suser)source.user=d.suser;if(d.ssudo==='yes')source.sudo=true;const power={};if(d.pstatus)power.status=d.pstatus;if(d.pstop)power.stop=d.pstop;if(d.pstart)power.start=d.pstart;if(Object.keys(power).length)source.power=power;return{name:d.name,writer:{vm:d.wvm||'ev2ahv-writer',host:d.whost||'10.12.136.211',user:d.wuser||'nutanix'},source,disks,nics,target:{vm_name:d.vm,cluster:d.cluster||'NTNX-DC',container:d.container||'VM_Container',sockets:+d.sockets||1,cores:+d.cores||2,threads:1,memory_mib:Math.round((+d.gib||4)*1024),firmware:d.fw||'bios',disk_bus:d.bus||'scsi'},sync:{chunk_mib:4,algo:d.algo||'auto',batch:32},verify:d.vip?{ip:d.vip,port:22}:{}}}
const yamlOf=(o,n=0)=>{const p=' '.repeat(n);if(Array.isArray(o))return o.length?o.map(x=>{const y=yamlOf(x,n+2);return p+'- '+y.trimStart()}).join('\n'):p+'[]';return Object.entries(o).map(([k,v])=>v&&typeof v==='object'?(Object.keys(v).length?`${p}${k}:\n${yamlOf(v,n+2)}`:`${p}${k}: {}`):`${p}${k}: ${typeof v==='string'?JSON.stringify(v):v}`).join('\n')};
function wizard(){const i=wiz.i,body=[()=>`<div class="two">${field('name','Plan name','', 'required pattern="[A-Za-z0-9][A-Za-z0-9._\\-]*"')}${sel('stype','Source reader',['direct','export','local'],'direct')}${field('shost','Source host (everRun node)')}${field('suser','SSH user','root')}${sel('ssudo','Use sudo',['no','yes'],'no')}${field('mbps','Read limit (MiB/s, 0 = none)','100','type=number min=0')}</div>${field('pstatus','Power status command')}${field('pstop','Power stop command')}${field('pstart','Power start command')}`,()=>`<div class="two">${field('cluster','Cluster','NTNX-DC','required')}${field('container','Storage container','VM_Container','required')}${field('wvm','Writer VM','ev2ahv-writer','required')}${field('whost','Writer IP','10.12.136.211','required')}</div>`,()=>`<div class="two">${field('vm','Target VM name','', 'required')}${field('sockets','Sockets','1','type=number min=1')}${field('cores','Cores per socket','2','type=number min=1')}${field('gib','Memory (GiB)','4','type=number min=0.5 step=0.5')}${sel('fw','Firmware',['bios','uefi'],'bios')}${sel('bus','Disk bus',['scsi','pci'],'scsi')}${sel('algo','Hash',['auto','xxh64','blake2b','sha256'],'auto')}${field('vip','Verify IP after cutover')}</div>`,()=>`<label>Disks, one per line: name path<textarea name="disks" style="min-height:110px" placeholder="boot /dev/mapper/vg-boot&#10;data /dev/mapper/vg-data">${esc(wiz.d.disks||'')}</textarea></label><label>NICs, one per line: subnet mac (omit the MAC to get a new one)<textarea name="nics" style="min-height:90px" placeholder="VLAN136 50:6b:8d:00:00:01">${esc(wiz.d.nics||'')}</textarea></label>`,()=>`<label>Plan YAML<textarea name="yaml">${esc(wiz.yaml||yamlOf(planDoc()))}</textarea></label>`][i]();
shell(`<div class="bar"><h1>Create Migration Plan</h1></div><div class="wiz">${WZ.map((n,x)=>`<div class="${x===i?'on':x<i?'done':''}">${x+1}. ${n}</div>`).join('')}</div><form class="card" id="w">${body}<div class="err" id="we"></div><div class="actions"><button type="button" class="btn" id="c">Cancel</button><span class="grow"></span>${i?'<button type="button" class="btn" id="b">Back</button>':''}<button class="btn primary">${i===4?'Save Plan':'Next'}</button></div></form>`);
const keep=()=>{const f=Object.fromEntries(new FormData($('#w')));if(i===4)wiz.yaml=f.yaml;else{Object.assign(wiz.d,f);wiz.yaml=null}};$('#c').onclick=()=>go('plans');if(i)$('#b').onclick=()=>{keep();wiz.i--;render()};$('#w').onsubmit=async e=>{e.preventDefault();keep();if(i<4){wiz.i++;return render()}try{const r=await api('/api/plans',{yaml:wiz.yaml});go('detail',r.name)}catch(x){$('#we').textContent=x.message}}}
render();
</script></body></html>
