# Unit tests, API contract and web type check. No lab access: nothing here talks to Prism or everRun.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # the appliance venv's Python
      - run: pip install -r appliance/requirements.txt
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: web/openapi.json matches the server models
        run: python tools/gen_openapi.py --check
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
