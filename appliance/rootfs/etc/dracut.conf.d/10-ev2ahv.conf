# Generic (not host-only) initramfs, restricted to what an AHV guest needs.
hostonly="no"
hostonly_cmdline="no"
compress="xz"
# 'drivers' is an exclusive list: only these modules are pulled in.
drivers+=" virtio virtio_ring virtio_pci virtio_pci_legacy_dev virtio_pci_modern_dev virtio_blk virtio_scsi virtio_net virtio_console net_failover failover "
drivers+=" scsi_mod scsi_common sd_mod sr_mod cdrom libata libahci ahci ata_piix ata_generic "
drivers+=" xfs ext4 jbd2 mbcache libcrc32c crc16 crc32c_generic crc32c-intel crct10dif-pclmul crc32-pclmul vfat fat isofs udf "
omit_dracutmodules+=" plymouth network network-manager nfs iscsi fcoe fcoe-uefi nvmf multipath mdraid dmraid lvm crypt dm btrfs cifs rdma biosdevname bluetooth nbd kernel-network-modules qemu-net resume i18n memstrack squash "
add_dracutmodules+=" "
