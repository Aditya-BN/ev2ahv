<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" role="img" aria-label="Lifecycle of one VM"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker></defs><rect width="880" height="460" fill="#fff"/><path d="M130 57 H170" fill="none" stroke="#37474f" stroke-width="1.6"  marker-end="url(#a)"/><path d="M290 57 H330" fill="none" stroke="#37474f" stroke-width="1.6"  marker-end="url(#a)"/><path d="M440 57 H490" fill="none" stroke="#37474f" stroke-width="1.6"  marker-end="url(#a)"/><path d="M660 45 H740" fill="none" stroke="#37474f" stroke-width="1.6"  marker-end="url(#a)"/><text x="700" y="38" font-size="13" fill="#37474f" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">Test</text><path d="M795 62 V110" fill="none" stroke="#37474f" stroke-width="1.6"  marker-end="url(#a)"/><text x="800" y="92" font-size="13" fill="#37474f" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3">test VM up</text><path d="M740 127 H640 V86" fill="none" stroke="#37474f" stroke-width="1.6"  marker-end="url(#a)"/><text x="690" y="120" font-size="13" fill="#37474f" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">Discard</text><path d="M560 86 V160" fill="none" stroke="#37474f" stroke-width="1.6"  marker-end="url(#a)"/><text x="568" y="128" font-size="13" fill="#37474f" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3">Cutover</text><path d="M575 218 V270" fill="none" stroke="#37474f" stroke-width="1.6"  marker-end="url(#a)"/><text x="583" y="248" font-size="13" fill="#37474f" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3">verified</text><path d="M490 290 H400" fill="none" stroke="#37474f" stroke-width="1.6"  marker-end="url(#a)"/><text x="445" y="283" font-size="13" fill="#37474f" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">Rollback</text><path d="M325 270 V120 H510 V86" fill="none" stroke="#b26a00" stroke-width="1.6"  marker-end="url(#a)"/><text x="335" y="114" font-size="13" fill="#b26a00" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3">AHV VM off, source on again</text><rect x="20" y="40" width="110" height="34" rx="17.0" fill="#e8f1f2" stroke="#0b6b73" stroke-width="1.8"/><text x="75.0" y="61.5" text-anchor="middle" font-size="15" font-weight="bold">Queued</text><rect x="170" y="40" width="120" height="34" rx="17.0" fill="#e8f1f2" stroke="#0b6b73" stroke-width="1.8"/><text x="230.0" y="61.5" text-anchor="middle" font-size="15" font-weight="bold">Preparing</text><rect x="330" y="40" width="110" height="34" rx="17.0" fill="#e8f1f2" stroke="#0b6b73" stroke-width="1.8"/><text x="385.0" y="61.5" text-anchor="middle" font-size="15" font-weight="bold">Seeding</text><rect x="490" y="28" width="170" height="58" rx="10" fill="#e0f2e9" stroke="#2e7d32" stroke-width="1.8"/><text x="575.0" y="54.0" text-anchor="middle" font-size="15" font-weight="bold">Ready to Cutover</text><text x="575.0" y="70.0" text-anchor="middle" font-size="12.5" fill="#455a64">resync every N minutes</text><rect x="740" y="28" width="110" height="34" rx="17.0" fill="#fff8e1" stroke="#b26a00" stroke-width="1.8"/><text x="795.0" y="49.5" text-anchor="middle" font-size="15" font-weight="bold">Testing</text><rect x="740" y="110" width="110" height="34" rx="17.0" fill="#fff8e1" stroke="#b26a00" stroke-width="1.8"/><text x="795.0" y="131.5" text-anchor="middle" font-size="15" font-weight="bold">Tested</text><rect x="470" y="160" width="210" height="58" rx="10" fill="#fde7e7" stroke="#c62828" stroke-width="1.8"/><text x="575.0" y="186.0" text-anchor="middle" font-size="15" font-weight="bold">Cutover in Progress</text><text x="575.0" y="202.0" text-anchor="middle" font-size="12.5" fill="#455a64">source stopped: the downtime</text><rect x="490" y="270" width="170" height="40" rx="10" fill="#e0f2e9" stroke="#2e7d32" stroke-width="1.8"/><text x="575.0" y="294.5" text-anchor="middle" font-size="15" font-weight="bold">Completed</text><rect x="250" y="270" width="150" height="40" rx="10" fill="#fff8e1" stroke="#b26a00" stroke-width="1.8"/><text x="325.0" y="294.5" text-anchor="middle" font-size="15" font-weight="bold">Rolling Back</text><text x="20" y="350" font-size="14" fill="#37474f">Preparing runs guest prep and the pre-checks; Seeding copies the disks while the VM runs.</text><text x="20" y="374" font-size="14" fill="#37474f">Cutover is also offered from Tested. A second cutover after a rollback discards the earlier AHV copy first.</text><text x="20" y="398" font-size="14" fill="#37474f">Any active state can also move to Paused (Pause, then Resume), to Cancelled,</text><text x="20" y="422" font-size="14" fill="#37474f">or to Failed. Retry returns a failed VM to the step that failed.</text></svg>