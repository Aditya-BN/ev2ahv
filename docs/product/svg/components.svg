<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" role="img" aria-label="ev2ahv components">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker></defs>
<rect x="0" y="0" width="900" height="560" fill="#fff"/>
<!-- appliance -->
<rect x="20" y="60" width="440" height="480" rx="10" fill="#e8f1f2" stroke="#0b6b73" stroke-width="2"/>
<text x="36" y="84" font-weight="bold" font-size="15" fill="#0b4f55">ev2ahv appliance (AHV VM, Rocky Linux 9)</text>
<rect x="40" y="100" width="180" height="40" rx="6" fill="#fff" stroke="#0b6b73"/><text x="130" y="125" text-anchor="middle">nginx :443 (TLS)</text>
<rect x="40" y="160" width="180" height="52" rx="6" fill="#fff" stroke="#0b6b73"/><text x="130" y="182" text-anchor="middle">API + web UI</text><text x="130" y="200" text-anchor="middle" font-size="12.5" fill="#455a64">unprivileged, unix socket</text>
<rect x="250" y="160" width="190" height="52" rx="6" fill="#fff" stroke="#0b6b73"/><text x="345" y="182" text-anchor="middle">Worker + runner</text><text x="345" y="200" text-anchor="middle" font-size="12.5" fill="#455a64">one engine process per step</text>
<rect x="250" y="232" width="190" height="64" rx="6" fill="#fff" stroke="#0b6b73"/><text x="345" y="254" text-anchor="middle">SQLite state</text><text x="345" y="272" text-anchor="middle" font-size="12.5" fill="#455a64">plans, chunk digests,</text><text x="345" y="286" text-anchor="middle" font-size="12.5" fill="#455a64">encrypted secrets</text>
<rect x="40" y="232" width="180" height="64" rx="6" fill="#fff8e1" stroke="#b26a00"/><text x="130" y="254" text-anchor="middle">ev2ahv-blockd (root)</text><text x="130" y="272" text-anchor="middle" font-size="12.5" fill="#455a64">allowlist: only vdisks</text><text x="130" y="286" text-anchor="middle" font-size="12.5" fill="#455a64">it hot-added itself</text>
<rect x="40" y="330" width="400" height="70" rx="6" fill="#fff" stroke="#0b6b73" stroke-dasharray="5 3"/><text x="240" y="356" text-anchor="middle">Staging vdisks</text><text x="240" y="376" text-anchor="middle" font-size="12.5" fill="#455a64">one per source disk, hot-added to the appliance by Prism,</text><text x="240" y="391" text-anchor="middle" font-size="12.5" fill="#455a64">written through blockd</text>
<rect x="40" y="425" width="400" height="95" rx="6" fill="#fff" stroke="#90a4ae"/><text x="240" y="447" text-anchor="middle" font-size="13.5" font-weight="bold">Also on the appliance</text><text x="240" y="467" text-anchor="middle" font-size="12.5" fill="#455a64">console menu (ev2ahv-config), ev2ahv-upgrade,</text><text x="240" y="483" text-anchor="middle" font-size="12.5" fill="#455a64">first-boot service, SELinux (enforcing), firewalld</text><text x="240" y="499" text-anchor="middle" font-size="12.5" fill="#455a64">own SSH key for everRun nodes and Linux guests</text>
<!-- browser -->
<rect x="20" y="8" width="140" height="36" rx="6" fill="#fff" stroke="#37474f"/><text x="90" y="31" text-anchor="middle">Admin browser</text>
<path d="M90 44 V50 H130 V100" fill="none" stroke="#37474f" stroke-width="1.5" marker-end="url(#a)"/><text x="170" y="38" font-size="12.5">HTTPS 443</text>
<path d="M130 140 V160" stroke="#37474f" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M220 186 H250" stroke="#37474f" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M345 212 V232" stroke="#37474f" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M290 212 V222 H130 V232" fill="none" stroke="#b26a00" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M130 296 V330" stroke="#b26a00" stroke-width="1.5" marker-end="url(#a)"/>
<!-- everrun -->
<rect x="520" y="20" width="360" height="270" rx="10" fill="#f3e9f7" stroke="#6a1b9a" stroke-width="2"/>
<text x="536" y="44" font-weight="bold" font-size="16" fill="#4a148c">Stratus everRun (2 nodes)</text>
<rect x="540" y="60" width="320" height="64" rx="6" fill="#fff" stroke="#6a1b9a"/><text x="700" y="82" text-anchor="middle">Read-only helper on the node</text><text x="700" y="100" text-anchor="middle" font-size="12.5" fill="#455a64">copied to /tmp over SSH, opens disks read-only,</text><text x="700" y="114" text-anchor="middle" font-size="12.5" fill="#455a64">hashes 4 MiB chunks, streams changed ones</text>
<rect x="540" y="138" width="320" height="52" rx="6" fill="#fff" stroke="#6a1b9a"/><text x="700" y="160" text-anchor="middle">everRun web API (DOH, HTTPS 443)</text><text x="700" y="178" text-anchor="middle" font-size="12.5" fill="#455a64">inventory, stop and start of the guest</text>
<rect x="540" y="204" width="320" height="64" rx="6" fill="#fff" stroke="#6a1b9a" stroke-dasharray="5 3"/><text x="700" y="226" text-anchor="middle">QEMU dirty-bitmap tracking (optional)</text><text x="700" y="244" text-anchor="middle" font-size="12.5" fill="#455a64">virsh + QMP over the same SSH login,</text><text x="700" y="258" text-anchor="middle" font-size="12.5" fill="#455a64">off by default, experimental</text>
<!-- nutanix -->
<rect x="520" y="320" width="360" height="220" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="536" y="344" font-weight="bold" font-size="16" fill="#1b5e20">Nutanix AHV cluster</text>
<rect x="540" y="360" width="320" height="64" rx="6" fill="#fff" stroke="#2e7d32"/><text x="700" y="382" text-anchor="middle">Prism Central v4 API (HTTPS 9440)</text><text x="700" y="400" text-anchor="middle" font-size="12.5" fill="#455a64">hot-add vdisks, create VM, clone disks,</text><text x="700" y="414" text-anchor="middle" font-size="12.5" fill="#455a64">power, network, projects</text>
<rect x="540" y="440" width="320" height="80" rx="6" fill="#fff" stroke="#2e7d32"/><text x="700" y="464" text-anchor="middle">Target VM</text><text x="700" y="482" text-anchor="middle" font-size="12.5" fill="#455a64">created at cutover; staging vdisks are</text><text x="700" y="496" text-anchor="middle" font-size="12.5" fill="#455a64">cloned into it, no data copy left</text>
<!-- links -->
<path d="M440 180 H490 V92 H540" fill="none" stroke="#6a1b9a" stroke-width="1.5" marker-end="url(#a)"/><text x="486" y="136" font-size="12.5" fill="#6a1b9a" text-anchor="end">22</text>
<path d="M490 164 H540" stroke="#6a1b9a" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M490 164 V236 H540" fill="none" stroke="#6a1b9a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="486" y="162" font-size="12.5" fill="#6a1b9a" text-anchor="end">443</text>
<path d="M440 200 H470 V392 H540" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#a)"/>
<text x="476" y="384" font-size="13.5" fill="#2e7d32">9440</text>
<path d="M700 424 V440" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#a)"/>
<text x="20" y="552" font-size="12.5" fill="#455a64">Solid arrows: always used. Dashed: optional. Guest preparation also reaches the guests over SSH (Linux) or WinRM 5985 (Windows).</text>
</svg>
