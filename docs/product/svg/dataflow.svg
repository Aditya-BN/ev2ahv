<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" role="img" aria-label="Data flow for one VM"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker></defs><rect width="900" height="800" fill="#fff"/><rect x="40" y="8" width="160" height="30" rx="6" fill="#0b6b73"/><text x="120" y="29" text-anchor="middle" font-size="14" fill="#fff">Appliance (engine)</text><line x1="120" y1="38" x2="120" y2="800" stroke="#90a4ae" stroke-dasharray="4 4"/><rect x="280" y="8" width="160" height="30" rx="6" fill="#0b6b73"/><text x="360" y="29" text-anchor="middle" font-size="14" fill="#fff">everRun node</text><line x1="360" y1="38" x2="360" y2="800" stroke="#90a4ae" stroke-dasharray="4 4"/><rect x="480" y="8" width="160" height="30" rx="6" fill="#0b6b73"/><text x="560" y="29" text-anchor="middle" font-size="14" fill="#fff">everRun web API</text><line x1="560" y1="38" x2="560" y2="800" stroke="#90a4ae" stroke-dasharray="4 4"/><rect x="700" y="8" width="160" height="30" rx="6" fill="#0b6b73"/><text x="780" y="29" text-anchor="middle" font-size="14" fill="#fff">Prism Central / AHV</text><line x1="780" y1="38" x2="780" y2="800" stroke="#90a4ae" stroke-dasharray="4 4"/><rect x="10" y="64" width="880" height="24" fill="#e0ecee"/><text x="20" y="81" font-weight="bold" font-size="15" fill="#0b4f55">Preparing</text><path d="M120 112 h34 v16 h-34" fill="none" stroke="#37474f" stroke-width="1.4" marker-end="url(#a)"/><text x="162" y="124" font-size="14">Guest prep over SSH or WinRM, then pre-checks (prep-check)</text><rect x="10" y="156" width="880" height="24" fill="#e0ecee"/><text x="20" y="173" font-weight="bold" font-size="15" fill="#0b4f55">Seeding  (the VM keeps running)</text><line x1="120" y1="204" x2="780" y2="204" stroke="#37474f" stroke-width="1.4" marker-end="url(#a)"/><text x="130" y="197" font-size="14" paint-order="stroke" stroke="#fff" stroke-width="5">Hot-add one staging vdisk per source disk</text><line x1="120" y1="240" x2="360" y2="240" stroke="#37474f" stroke-width="1.4" marker-end="url(#a)"/><text x="130" y="233" font-size="14" paint-order="stroke" stroke="#fff" stroke-width="5">Start helper, read every chunk, hash it</text><line x1="360" y1="276" x2="120" y2="276" stroke="#37474f" stroke-width="1.4" marker-end="url(#a)"/><text x="130" y="269" font-size="14" paint-order="stroke" stroke="#fff" stroke-width="5">Send chunks that are not all zero</text><path d="M120 312 h34 v16 h-34" fill="none" stroke="#37474f" stroke-width="1.4" marker-end="url(#a)"/><text x="162" y="324" font-size="14">Write chunks through blockd, store digests after fsync</text><rect x="10" y="356" width="880" height="24" fill="#e0ecee"/><text x="20" y="373" font-weight="bold" font-size="15" fill="#0b4f55">Ready to Cutover  (resync every N minutes)</text><line x1="360" y1="404" x2="120" y2="404" stroke="#37474f" stroke-width="1.4" marker-end="url(#a)"/><text x="130" y="397" font-size="14" paint-order="stroke" stroke="#fff" stroke-width="5">Hash again, send only chunks whose digest changed</text><rect x="10" y="434" width="880" height="24" fill="#e0ecee"/><text x="20" y="451" font-weight="bold" font-size="15" fill="#0b4f55">Cutover  (downtime starts)</text><line x1="120" y1="482" x2="560" y2="482" stroke="#37474f" stroke-width="1.4" marker-end="url(#a)"/><text x="130" y="475" font-size="14" paint-order="stroke" stroke="#fff" stroke-width="5">Stop the guest</text><line x1="360" y1="518" x2="120" y2="518" stroke="#37474f" stroke-width="1.4" marker-end="url(#a)"/><text x="130" y="511" font-size="14" paint-order="stroke" stroke="#fff" stroke-width="5">Final sync with the source off, repeat until a pass sends nothing</text><path d="M120 554 h34 v16 h-34" fill="none" stroke="#37474f" stroke-width="1.4" marker-end="url(#a)"/><text x="162" y="566" font-size="14">Check the target (final_verify: full, sample or none)</text><line x1="120" y1="604" x2="780" y2="604" stroke="#37474f" stroke-width="1.4" marker-end="url(#a)"/><text x="130" y="597" font-size="14" paint-order="stroke" stroke="#fff" stroke-width="5">Create the target VM with the source MAC, clone the staging vdisks, power on</text><line x1="120" y1="640" x2="780" y2="640" stroke="#37474f" stroke-width="1.4" marker-end="url(#a)"/><text x="130" y="633" font-size="14" paint-order="stroke" stroke="#fff" stroke-width="5">Verify: powered on and the guest answers on its IP</text><rect x="10" y="670" width="880" height="24" fill="#e0ecee"/><text x="20" y="687" font-weight="bold" font-size="15" fill="#0b4f55">Rollback  (only if needed)</text><line x1="120" y1="718" x2="780" y2="718" stroke="#37474f" stroke-width="1.4" marker-end="url(#a)"/><text x="130" y="711" font-size="14" paint-order="stroke" stroke="#fff" stroke-width="5">Power the AHV VM off</text><line x1="120" y1="754" x2="560" y2="754" stroke="#37474f" stroke-width="1.4" marker-end="url(#a)"/><text x="130" y="747" font-size="14" paint-order="stroke" stroke="#fff" stroke-width="5">Start the everRun guest again</text></svg>